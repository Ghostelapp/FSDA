name: Build Signed Android AAB/APK & Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Ścieżka publikacji w Google Play (internal, alpha, beta, production)'
        required: true
        default: 'internal'
  push:
    branches:
      - main
      - release/play-store

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod źródłowy
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Konfiguracja Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Android SDK
        uses: android-actions/setup-android@v3

      - name: Konfiguracja Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalacja zależności i budowa PWA
        run: |
          npm install
          npm run build

      - name: Budowanie pakietu Android App Bundle (.aab) oraz APK
        working-directory: ./android
        run: |
          gradle bundleRelease assembleRelease --no-daemon

      - name: Udostępnij gotowe pliki APK i AAB do pobrania (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-academy-google-play-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            public/play-store/*
            public/.well-known/assetlinks.json

      - name: Sprawdź dostępność klucza Google Play Console
        id: play-config
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Automatyczna publikacja w Google Play Console (gdy podano klucz PLAY_SERVICE_ACCOUNT_JSON)
        if: steps.play-config.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fullstackacademy.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
