apply plugin: 'com.android.application'

android {
    namespace "com.fullstackacademy.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.fullstackacademy.app"
        minSdk 24
        targetSdk 36
        versionCode 10
        versionName "3.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Web app host configuration
        manifestPlaceholders = [
            hostName: "fsda.tech",
            defaultUrl: "https://fsda.tech/app",
            launcherName: "@string/launcher_name"
        ]
    }

    signingConfigs {
        release {
            storeFile file("../android.keystore")
            storePassword "fullstack2026"
            keyAlias "android"
            keyPassword "fullstack2026"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Official Google Android Browser Helper library for Trusted Web Activities
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
